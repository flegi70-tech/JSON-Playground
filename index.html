<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JSON Playground</title>
<style>
:root{
  --bg:#0f0d16; --pn:#171424; --pn2:#1e1a2e; --ln:#2c2644; --tx:#e9e5f7; --mt:#8d86a8;
  --ac:#a78bfa; --ac2:#7c5cf0; --ok:#4ade80; --er:#fb7185; --str:#86efac; --num:#fbbf24; --bol:#f0abfc; --nul:#94a3b8; --key:#c4b5fd;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--pn)}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
header h1 b{color:var(--ac)}
header span{color:var(--mt);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px;height:calc(100vh - 50px)}
.col{display:flex;flex-direction:column;min-height:0;background:var(--pn);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.tb{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--ln);align-items:center}
button,select,input[type=text]{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:7px;padding:5px 10px}
button{cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac2);border-color:var(--ac2);color:#fff}
button.sm{padding:3px 8px;font-size:12px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.ed{position:relative;flex:1;min-height:0;display:flex}
#gut{width:46px;flex:none;overflow:hidden;background:#120f1d;color:var(--mt);font:13px/20px var(--mono);text-align:right;padding:8px 8px 8px 0;user-select:none;border-right:1px solid var(--ln)}
#gut div.e{color:#fff;background:var(--er)}
#ta{flex:1;min-width:0;resize:none;border:0;border-radius:0;background:transparent;color:var(--tx);font:13px/20px var(--mono);padding:8px 10px;white-space:pre;overflow:auto;tab-size:2}
#ta:focus{outline:none}
#st{padding:7px 12px;border-top:1px solid var(--ln);font-size:13px;min-height:34px}
#st.ok{color:var(--ok)} #st.bad{color:var(--er);cursor:pointer}
.keys{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--ln);overflow-x:auto}
.keys button{font-family:var(--mono);min-width:38px;padding:6px 8px}
.tabs{display:flex;border-bottom:1px solid var(--ln);overflow-x:auto}
.tabs button{border:0;border-radius:0;background:transparent;color:var(--mt);padding:9px 14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.pane{display:none;flex:1;min-height:0;overflow:auto;padding:10px}
.pane.on{display:block}
#tree{font:13px/1.6 var(--mono)}
.n .ch{margin-left:16px;border-left:1px dashed var(--ln);padding-left:8px}
.row{white-space:nowrap}
.tg{display:inline-block;width:14px;color:var(--mt);cursor:pointer;user-select:none}
.k{color:var(--key);cursor:pointer}
.k:hover{text-decoration:underline}
.idx{color:var(--mt);cursor:pointer}
.sum{color:var(--mt)}
.t-s{color:var(--str)} .t-n{color:var(--num)} .t-b{color:var(--bol)} .t-z{color:var(--nul);font-style:italic}
.more{color:var(--mt);font-style:italic}
pre.out{margin:0;font:13px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.q{display:flex;gap:6px;margin-bottom:8px}
.q input{flex:1;font-family:var(--mono)}
.hint{color:var(--mt);font-size:12px;margin:0 0 8px}
.card{border:1px solid var(--ln);background:var(--pn2);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.card h3{margin:0 0 2px;font-size:14px}
.card p{margin:2px 0 8px;color:var(--mt)}
.card .task{color:var(--num);margin:0 0 8px}
.card .row2{display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--pn2);border:1px solid var(--ln);border-radius:9px;padding:8px 10px}
.stat b{display:block;font-size:20px;color:var(--ac)}
.stat span{color:var(--mt);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ac2);color:#fff;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
.empty{color:var(--mt);padding:14px 4px}
@media (max-width:820px){
  main{grid-template-columns:1fr;height:auto}
  .col{min-height:0}
  .ed{height:46vh;flex:none}
  .pane{min-height:48vh}
  header span{display:none}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header><h1>JSON <b>Playground</b></h1><span>Edituj, ověř, formátuj a prohlížej JSON. Všechno běží u tebe v prohlížeči.</span></header>
<main>
  <section class="col">
    <div class="tb">
      <button class="pri" id="bFmt">Formátovat</button>
      <select id="indent" title="Odsazení"><option value="2">2 mezery</option><option value="4">4 mezery</option><option value="tab">Tabulátor</option></select>
      <button id="bMin">Zhustit</button>
      <button id="bSort">Seřadit klíče</button>
      <button id="bFix">Opravit</button>
      <button id="bCsv">→ CSV</button>
      <button id="bCopy">Kopírovat</button>
      <button id="bSave">Uložit</button>
      <button id="bDown">Stáhnout</button>
      <button id="bUp">Nahrát</button>
      <button id="bClear">Vymazat</button>
      <input type="file" id="file" accept=".json,application/json,text/plain" hidden>
    </div>
    <div class="ed"><div id="gut"></div><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="JSON editor"></textarea></div>
    <div class="keys" id="keys"></div>
    <div id="st">Připraveno</div>
  </section>

  <section class="col">
    <div class="tabs" id="tabs">
      <button data-p="pTree" class="on">Strom</button>
      <button data-p="pOut">Výstup</button>
      <button data-p="pInfo">Info</button>
      <button data-p="pEx">Příklady</button>
      <button data-p="pMine">Moje</button>
    </div>
    <div class="pane on" id="pTree">
      <div class="tb" style="padding:0 0 8px;border:0">
        <button class="sm" id="bExp">Rozbalit vše</button>
        <button class="sm" id="bCol">Sbalit</button>
        <span class="sum">Klepni na klíč = zkopíruje cestu</span>
      </div>
      <div id="tree"></div>
    </div>
    <div class="pane" id="pOut">
      <div class="q"><input type="text" id="qin" placeholder="Cesta, např. menu[0].nazev nebo $.menu[*].cena" aria-label="Cesta"><button class="pri" id="bQ">Najít</button></div>
      <p class="hint">Podporuji tečku, [číslo], ["klíč"] a hvězdičku * pro všechny položky. Dole se objeví i výsledek převodu na CSV.</p>
      <pre class="out" id="out"></pre>
      <div style="margin-top:8px"><button class="sm" id="bOutCopy">Kopírovat výstup</button></div>
    </div>
    <div class="pane" id="pInfo"><div id="info" class="empty">Zatím není co analyzovat.</div></div>
    <div class="pane" id="pEx"><div id="exList"></div></div>
    <div class="pane" id="pMine"><div id="mineList"></div></div>
  </section>
</main>
<div id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const ta=$("#ta"), gut=$("#gut"), st=$("#st");
let cur=null, curValid=false;

/* ---------- vlastní striktní parser s českými chybami ---------- */
function parseJSON(src){
  let i=0; const n=src.length;
  const err=(msg,pos)=>{throw {msg, pos: pos===undefined? i : pos}};
  const ws=()=>{while(i<n && " \t\n\r".includes(src[i])) i++};
  function val(){
    ws();
    if(i>=n) err("Čekal jsem hodnotu, ale text už skončil",n);
    const c=src[i];
    if(c==="{") return obj();
    if(c==="[") return arr();
    if(c==='"') return str();
    if(c==="-"||(c>="0"&&c<="9")) return num();
    for(const [w,v] of [["true",true],["false",false],["null",null]]) if(src.startsWith(w,i)){i+=w.length;return v}
    if(c==="'") err("Text musí být v dvojitých uvozovkách \"…\", apostrofy JSON nepovoluje");
    if(c==="}"||c==="]"||c===",") err("Neočekávaný znak „"+c+"“ – tady má být hodnota");
    err("Neočekávaný znak „"+c+"“ – čekal jsem text, číslo, true, false, null, { nebo [");
  }
  function obj(){
    i++; const o={}; ws();
    if(src[i]==="}"){i++;return o}
    for(;;){
      ws();
      if(i>=n) err("Chybí ukončující }",n);
      if(src[i]==="}") err("Za poslední položkou je čárka navíc (JSON koncovou čárku nepovoluje)");
      if(src[i]!=='"') err("Klíč musí být v uvozovkách \"…\"");
      const k=str(); ws();
      if(src[i]!==":") err("Za klíčem chybí dvojtečka :");
      i++; o[k]=val(); ws();
      if(src[i]===","){i++;continue}
      if(src[i]==="}"){i++;return o}
      err(i>=n? "Chybí ukončující }" : "Mezi položkami chybí čárka (nebo ukončující })", i>=n? n : i);
    }
  }
  function arr(){
    i++; const a=[]; ws();
    if(src[i]==="]"){i++;return a}
    for(;;){
      ws();
      if(i>=n) err("Chybí ukončující ]",n);
      if(src[i]==="]") err("Za poslední položkou je čárka navíc (JSON koncovou čárku nepovoluje)");
      a.push(val()); ws();
      if(src[i]===","){i++;continue}
      if(src[i]==="]"){i++;return a}
      err(i>=n? "Chybí ukončující ]" : "Mezi položkami chybí čárka (nebo ukončující ])", i>=n? n : i);
    }
  }
  function str(){
    const start=i; i++; let s="";
    while(i<n){
      const c=src[i];
      if(c==='"'){i++;return s}
      if(c==="\\"){
        const e=src[i+1];
        const m={'"':'"',"\\":"\\","/":"/",b:"\b",f:"\f",n:"\n",r:"\r",t:"\t"};
        if(e in m){s+=m[e];i+=2}
        else if(e==="u"){
          const h=src.slice(i+2,i+6);
          if(!/^[0-9a-fA-F]{4}$/.test(h)) err("Neplatná sekvence \\u – čekám 4 hexadecimální znaky");
          s+=String.fromCharCode(parseInt(h,16)); i+=6;
        } else err("Neplatná escape sekvence „\\"+(e||"")+"“");
      } else if(c<" "){
        err("Uvnitř textu je zalomení řádku nebo řídicí znak – použij \\n");
      } else {s+=c;i++}
    }
    err("Text není ukončen uvozovkou \"",start);
  }
  function num(){
    const re=/-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?/y; re.lastIndex=i;
    const m=re.exec(src);
    if(!m) err("Neplatné číslo");
    i+=m[0].length; return Number(m[0]);
  }
  const v=val(); ws();
  if(i<n) err("Za hodnotou je navíc další text");
  return v;
}
function lineCol(pos){
  const before=ta.value.slice(0,pos); const lines=before.split("\n");
  return {line:lines.length, col:lines[lines.length-1].length+1};
}

/* ---------- automatická oprava běžných chyb ---------- */
function tryFix(s){
  const parts=[]; let i=0,buf=""; const n=s.length;
  while(i<n){
    const c=s[i];
    if(c==='"'||c==="'"){
      parts.push({o:buf}); buf=""; const q=c; let j=i+1, body="";
      while(j<n && s[j]!==q){
        if(s[j]==="\\" && j+1<n){ body += (s[j+1]==="'") ? "'" : s[j]+s[j+1]; j+=2 }
        else { body += (s[j]==='"' && q==="'") ? '\\"' : (s[j]==="\n" ? "\\n" : s[j]); j++ }
      }
      parts.push({s:'"'+body+'"'}); i=j+1; continue;
    }
    if(c==="/" && s[i+1]==="/"){ while(i<n && s[i]!=="\n") i++; continue }
    if(c==="/" && s[i+1]==="*"){ const e=s.indexOf("*/",i+2); i = e<0 ? n : e+2; continue }
    buf+=c; i++;
  }
  parts.push({o:buf});
  return parts.map(p=>{
    if(p.s!==undefined) return p.s;
    return p.o
      .replace(/\bTrue\b/g,"true").replace(/\bFalse\b/g,"false").replace(/\b(None|undefined|NaN)\b/g,"null")
      .replace(/,(\s*[}\]])/g,"$1")
      .replace(/([{,]\s*)([A-Za-z_$][\w$]*)(\s*:)/g,'$1"$2"$3');
  }).join("");
}

/* ---------- pomocné ---------- */
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let tt; function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
function indentVal(){const v=$("#indent").value;return v==="tab"?"\t":Number(v)}
function sortKeys(v){
  if(Array.isArray(v)) return v.map(sortKeys);
  if(v&&typeof v==="object"){const o={};Object.keys(v).sort((a,b)=>a.localeCompare(b)).forEach(k=>o[k]=sortKeys(v[k]));return o}
  return v;
}
function describe(v){
  if(Array.isArray(v)) return "pole, "+v.length+" "+(v.length===1?"položka":v.length>=2&&v.length<=4?"položky":"položek");
  if(v&&typeof v==="object"){const k=Object.keys(v).length;return "objekt, "+k+" "+(k===1?"klíč":k>=2&&k<=4?"klíče":"klíčů")}
  if(v===null) return "null";
  return {string:"text",number:"číslo",boolean:"true/false"}[typeof v];
}

/* ---------- editor ---------- */
function gutter(errLine){
  const n=ta.value.split("\n").length; let h="";
  for(let i=1;i<=n;i++) h+='<div'+(i===errLine?' class="e"':'')+'>'+i+'</div>';
  gut.innerHTML=h; gut.scrollTop=ta.scrollTop;
}
let vt;
function validate(){
  const src=ta.value;
  try{ localStorage.setItem("jsonpg.cur",src) }catch(e){}
  if(!src.trim()){cur=null;curValid=false;gutter(0);st.className="";st.textContent="Prázdný editor – napiš JSON nebo vyber příklad";$("#tree").innerHTML='<div class="empty">Tady se ukáže strom, jakmile bude JSON platný.</div>';$("#info").innerHTML='<div class="empty">Zatím není co analyzovat.</div>';return}
  try{
    cur=parseJSON(src); curValid=true; gutter(0);
    st.className="ok"; st.textContent="✓ Platný JSON – "+describe(cur)+" · "+new Blob([src]).size+" B";
    renderTree(cur,2); renderInfo(cur);
  }catch(e){
    if(e.pos===undefined) throw e;
    curValid=false; const lc=lineCol(e.pos); gutter(lc.line);
    st.className="bad"; st.dataset.pos=e.pos;
    st.textContent="✗ Řádek "+lc.line+", sloupec "+lc.col+": "+e.msg;
    $("#tree").innerHTML='<div class="empty">JSON zatím není platný, strom nejde zobrazit. Oprava chyby na řádku '+lc.line+' (klepni na červenou lištu pod editorem).</div>';
  }
}
function jumpToError(){
  if(!st.classList.contains("bad")) return;
  const p=Number(st.dataset.pos); ta.focus(); ta.setSelectionRange(p,Math.min(p+1,ta.value.length));
  const lc=lineCol(p); ta.scrollTop=Math.max(0,(lc.line-4)*20);
}
st.addEventListener("click",jumpToError);
ta.addEventListener("input",()=>{gutter(0);clearTimeout(vt);vt=setTimeout(validate,150)});
ta.addEventListener("scroll",()=>{gut.scrollTop=ta.scrollTop});
ta.addEventListener("keydown",e=>{
  if(e.key==="Tab"){e.preventDefault();insert("  ")}
});
function insert(t){
  const s=ta.selectionStart,e=ta.selectionEnd;
  ta.setRangeText(t,s,e,"end"); ta.focus();
  gutter(0); clearTimeout(vt); vt=setTimeout(validate,150);
}
function setText(t){ta.value=t;ta.scrollTop=0;validate()}

/* zkratky pro dotykovou klávesnici */
["{","}","[","]",'"',":",",","⇥"].forEach(k=>{
  const b=document.createElement("button"); b.textContent=k;
  b.addEventListener("mousedown",e=>e.preventDefault());
  b.addEventListener("click",()=>insert(k==="⇥"?"  ":k));
  $("#keys").appendChild(b);
});

/* ---------- strom ---------- */
function pathOf(base,k,isArr){
  if(isArr) return base+"["+k+"]";
  return /^[A-Za-z_$][\w$]*$/.test(k) ? base+"."+k : base+'["'+k.replace(/"/g,'\\"')+'"]';
}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function leaf(v){
  if(v===null) return mk("span","t-z","null");
  if(typeof v==="string") return mk("span","t-s",JSON.stringify(v));
  if(typeof v==="number") return mk("span","t-n",String(v));
  return mk("span","t-b",String(v));
}
function node(key,isIdx,v,path,depth,openDepth){
  const wrap=mk("div","n"), row=mk("div","row");
  const isC=v&&typeof v==="object", isA=Array.isArray(v);
  const kEl=()=>{
    const k=mk("span",isIdx?"idx":"k",isIdx?String(key):'"'+key+'"');
    k.title=path; k.addEventListener("click",()=>pickPath(path));
    return k;
  };
  if(!isC){
    row.append(mk("span","tg",""));
    if(key!==null){row.append(kEl(),mk("span","sum",": "))}
    row.append(leaf(v)); wrap.append(row); return wrap;
  }
  const entries=isA?v.map((x,i)=>[i,x]):Object.entries(v);
  const tg=mk("span","tg"), ch=mk("div","ch");
  let open=depth<openDepth, done=false;
  const fill=()=>{
    if(done) return; done=true;
    const LIM=300;
    entries.slice(0,LIM).forEach(([k,x])=>ch.append(node(k,isA,x,pathOf(path,k,isA),depth+1,openDepth)));
    if(entries.length>LIM) ch.append(mk("div","more","… dalších "+(entries.length-LIM)+" položek"));
  };
  const apply=()=>{tg.textContent=open?"▾":"▸";ch.style.display=open?"":"none";if(open)fill()};
  tg.addEventListener("click",()=>{open=!open;apply()});
  row.append(tg);
  if(key!==null){row.append(kEl(),mk("span","sum",": "))}
  row.append(mk("span","sum",isA?"[ "+entries.length+" ]":"{ "+entries.length+" }"));
  wrap.append(row,ch); apply(); return wrap;
}
function renderTree(v,openDepth){
  const r=$("#tree"); r.innerHTML=""; r.append(node(null,false,v,"$",0,openDepth));
}
function pickPath(p){
  $("#qin").value=p;
  try{navigator.clipboard&&navigator.clipboard.writeText(p)}catch(e){}
  toast("Cesta "+p+" je ve schránce i v poli „Výstup“");
}
$("#bExp").onclick=()=>{if(curValid)renderTree(cur,6)};
$("#bCol").onclick=()=>{if(curValid)renderTree(cur,1)};

/* ---------- dotaz na cestu ---------- */
function evalPath(root,p){
  p=p.trim(); if(p.startsWith("$")) p=p.slice(1);
  if(p&&p[0]!=="."&&p[0]!=="[") p="."+p;
  let res=[root], multi=false, pos=0;
  const re=/\.\*|\[\*\]|\.([A-Za-z_$][\w$-]*)|\[(\d+)\]|\["((?:[^"\\]|\\.)*)"\]|\['([^']*)'\]/y;
  while(pos<p.length){
    re.lastIndex=pos; const m=re.exec(p);
    if(!m) throw new Error("Neplatná cesta u znaku "+(pos+1)+": „"+p.slice(pos,pos+6)+"“");
    pos=re.lastIndex; const next=[];
    if(m[0]===".*"||m[0]==="[*]"){
      multi=true;
      res.forEach(x=>{if(Array.isArray(x))next.push(...x);else if(x&&typeof x==="object")next.push(...Object.values(x))});
    } else {
      const key=m[1]!==undefined?m[1]:m[2]!==undefined?Number(m[2]):m[3]!==undefined?m[3].replace(/\\"/g,'"'):m[4];
      res.forEach(x=>{
        if(x&&typeof x==="object"&&Object.prototype.hasOwnProperty.call(x,key)) next.push(x[key]);
      });
    }
    res=next;
  }
  return {res,multi};
}
function showOut(t){$("#out").textContent=t;activate("pOut")}
$("#bQ").onclick=runQuery;
$("#qin").addEventListener("keydown",e=>{if(e.key==="Enter")runQuery()});
function runQuery(){
  if(!curValid){showOut("JSON není platný – nejdřív oprav chybu.");return}
  const q=$("#qin").value;
  if(!q.trim()){showOut(JSON.stringify(cur,null,2));return}
  try{
    const {res,multi}=evalPath(cur,q);
    if(!res.length) showOut("Nic nenalezeno pro "+q);
    else showOut(JSON.stringify(multi?res:res[0],null,2));
  }catch(e){showOut(e.message)}
}
$("#bOutCopy").onclick=()=>copy($("#out").textContent);

/* ---------- info ---------- */
function renderInfo(v){
  const c={objekty:0,pole:0,texty:0,čísla:0,"true/false":0,null:0}; let maxD=0; const keys=new Set();
  (function w(x,d){
    maxD=Math.max(maxD,d);
    if(Array.isArray(x)){c.pole++;x.forEach(y=>w(y,d+1))}
    else if(x&&typeof x==="object"){c.objekty++;Object.entries(x).forEach(([k,y])=>{keys.add(k);w(y,d+1)})}
    else if(x===null)c.null++; else if(typeof x==="string")c.texty++; else if(typeof x==="number")c["čísla"]++; else c["true/false"]++;
  })(v,0);
  const src=ta.value, min=JSON.stringify(v);
  const items=[["Velikost",new Blob([src]).size+" B"],["Zhuštěný",new Blob([min]).size+" B"],["Řádků",src.split("\n").length],["Hloubka",maxD],["Unikátních klíčů",keys.size]]
    .concat(Object.entries(c).map(([k,n])=>[k.charAt(0).toUpperCase()+k.slice(1),n]));
  $("#info").className="grid";
  $("#info").innerHTML=items.map(([k,n])=>'<div class="stat"><b>'+esc(n)+'</b><span>'+esc(k)+'</span></div>').join("");
}

/* ---------- akce ---------- */
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast("Zkopírováno"),()=>fallbackCopy(t));
  else fallbackCopy(t);
}
function fallbackCopy(t){const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();try{document.execCommand("copy");toast("Zkopírováno")}catch(e){toast("Kopírování se nepovedlo")}a.remove()}
function needValid(){if(!curValid){toast("Nejdřív oprav chybu v JSONu");return false}return true}
$("#bFmt").onclick=()=>{if(needValid())setText(JSON.stringify(cur,null,indentVal()))};
$("#bMin").onclick=()=>{if(needValid())setText(JSON.stringify(cur))};
$("#bSort").onclick=()=>{if(needValid())setText(JSON.stringify(sortKeys(cur),null,indentVal()))};
$("#bFix").onclick=()=>{
  if(curValid){toast("JSON je už platný");return}
  if(!ta.value.trim()) return;
  const f=tryFix(ta.value); setText(f);
  toast(curValid?"Opraveno – zkontroluj výsledek":"Něco jsem opravil, ale ještě zbývá chyba");
};
$("#bCopy").onclick=()=>copy(ta.value);
$("#bClear").onclick=()=>{setText("");ta.focus()};
$("#bDown").onclick=()=>{
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ta.value],{type:"application/json"}));
  a.download="data.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("#bUp").onclick=()=>$("#file").click();
$("#file").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{setText(String(r.result));toast("Načteno: "+f.name)}; r.readAsText(f); e.target.value="";
};
$("#bCsv").onclick=()=>{
  if(!needValid()) return;
  if(!Array.isArray(cur)||!cur.length||!cur.every(x=>x&&typeof x==="object"&&!Array.isArray(x))){
    showOut("Na CSV potřebuji pole objektů, např. [ {\"a\":1}, {\"a\":2} ]. Tady je "+describe(cur)+".");return;
  }
  const cols=[]; cur.forEach(o=>Object.keys(o).forEach(k=>{if(!cols.includes(k))cols.push(k)}));
  const cell=v=>{
    if(v===undefined||v===null) return "";
    let s=typeof v==="object"?JSON.stringify(v):String(v);
    return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  };
  const lines=[cols.map(cell).join(";")].concat(cur.map(o=>cols.map(k=>cell(o[k])).join(";")));
  showOut(lines.join("\n"));
  toast("CSV se středníkem – otevře se rovnou v českém Excelu");
};

/* ---------- záložky ---------- */
function activate(id){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.p===id));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id===id));
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)activate(b.dataset.p)});

function renderEx(){
  $("#exList").innerHTML="";
  EX.forEach((x,i)=>{
    const c=mk("div","card");
    c.append(mk("h3","",x.t),mk("p","",x.d),mk("p","task","Úkol: "+x.task));
    const r=mk("div","row2"), b=mk("button","pri sm","Načíst do editoru");
    b.onclick=()=>{setText(x.s);toast("Načteno: "+x.t);if(matchMedia("(max-width:820px)").matches)window.scrollTo({top:0,behavior:"smooth"})};
    r.append(b); c.append(r); $("#exList").append(c);
  });
}

/* ---------- moje uložené ---------- */
function mine(){try{return JSON.parse(localStorage.getItem("jsonpg.mine")||"[]")}catch(e){return []}}
function saveMine(a){try{localStorage.setItem("jsonpg.mine",JSON.stringify(a))}catch(e){toast("Ukládání v tomto prohlížeči není dostupné")}}
function renderMine(){
  const a=mine(), box=$("#mineList"); box.innerHTML="";
  if(!a.length){box.append(mk("div","empty","Zatím nic uloženo. Tlačítkem Uložit nad editorem si schováš aktuální JSON pod vlastním názvem."));return}
  a.forEach((x,i)=>{
    const c=mk("div","card"); c.append(mk("h3","",x.name),mk("p","",new Date(x.at).toLocaleString("cs-CZ")+" · "+x.text.length+" znaků"));
    const r=mk("div","row2"), l=mk("button","pri sm","Načíst"), d=mk("button","sm","Smazat");
    l.onclick=()=>{setText(x.text);toast("Načteno: "+x.name)};
    d.onclick=()=>{const b=mine();b.splice(i,1);saveMine(b);renderMine()};
    r.append(l,d); c.append(r); box.append(c);
  });
}
$("#bSave").onclick=()=>{
  if(!ta.value.trim()){toast("Není co uložit");return}
  const name=prompt("Název uloženého JSONu:","Můj JSON "+(mine().length+1)); if(!name) return;
  const a=mine(); a.unshift({name:name.trim(),text:ta.value,at:Date.now()}); saveMine(a); renderMine(); toast("Uloženo do záložky Moje");
};

/* ---------- start ---------- */
renderEx(); renderMine();
let start=""; try{start=localStorage.getItem("jsonpg.cur")||""}catch(e){}
setText(start.trim()?start:EX[2].s);
